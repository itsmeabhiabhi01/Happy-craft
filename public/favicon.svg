<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Top Face (Lush Grass) -->
    <polygon points="32,6 56,19 32,32 8,19" fill="#58be32"/>
    <polygon points="32,6 44,12.5 32,19 20,12.5" fill="#6edd44"/>
    <polygon points="26,16 38,22.5 32,26 20,19.5" fill="#4aa428"/>
    <polygon points="38,12.5 50,19 44,22.5 32,16" fill="#69d63f"/>
    <polygon points="14,16 26,22.5 20,26 8,19" fill="#449924"/>

    <!-- Left Face (Dirt) -->
    <polygon points="8,19 32,32 32,57 8,44" fill="#7d502a"/>
    <!-- Left Dirt Specks -->
    <polygon points="12,32 18,35 18,39 12,36" fill="#653f1f"/>
    <polygon points="22,38 28,41 28,45 22,42" fill="#925f33"/>
    <polygon points="14,41 20,44 20,48 14,45" fill="#5b3719"/>
    <polygon points="24,46 30,49 30,53 24,50" fill="#674120"/>

    <!-- Left Grass Overhang -->
    <path d="M8,19 L32,32 L32,38 L28,36 L24,40 L20,36 L16,39 L12,35 L8,27 Z" fill="#46a025"/>

    <!-- Right Face (Shadow Dirt) -->
    <polygon points="32,32 56,19 56,44 32,57" fill="#5c381b"/>
    <!-- Right Dirt Specks -->
    <polygon points="36,39 42,36 42,40 36,43" fill="#4a2c14"/>
    <polygon points="46,33 52,30 52,34 46,37" fill="#6f4422"/>
    <polygon points="38,47 44,44 44,48 38,51" fill="#4a2c14"/>
    <polygon points="46,42 52,39 52,43 46,46" fill="#422610"/>

    <!-- Right Grass Overhang -->
    <path d="M32,32 L56,19 L56,26 L52,34 L48,31 L44,36 L40,32 L36,36 L32,35 Z" fill="#367d1c"/>

    <!-- Happy Eyes on Front Left Face -->
    <!-- Left Eye -->
    <rect x="13" y="27" width="3" height="4" rx="0.5" transform="skewY(27)" fill="#1a120b"/>
    <!-- Right Eye -->
    <rect x="23" y="22" width="3" height="4" rx="0.5" transform="skewY(27)" fill="#1a120b"/>
    <!-- Happy Smile -->
    <path d="M 15,37 Q 21,43 25,35" stroke="#1a120b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Cheerful Cheeks -->
    <circle cx="14" cy="35" r="1.5" fill="#e07260" opacity="0.8"/>
    <circle cx="26" cy="41" r="1.5" fill="#e07260" opacity="0.8"/>
  </g>
</svg>
